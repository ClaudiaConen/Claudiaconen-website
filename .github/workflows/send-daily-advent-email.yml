name: Send Daily Advent Email

on:
  schedule:
    - cron: '0 6 * 12 *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send Daily Advent Notification
        run: |
          curl -X POST \
            '${{ secrets.SUPABASE_URL }}/functions/v1/send-daily-advent-notification' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Content-Type: application/json'
